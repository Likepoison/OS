[package]
name = "likepoison-proj20-kernel-alloc"
description = "Kernel memory allocator for rCore tutorial OS using buddy allocation."
version = "0.1.0"
edition = "2024"
authors = ["YdrMaster <ydrml@hotmail.com>"]
repository = "https://github.com/Likepoison/OS"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "kernel", "allocator", "riscv"]
categories = ["no-std", "embedded", "memory-management"]

[dependencies]
log = "0.4"
customizable-buddy = "0.0.4"
page-table = "0.0.6"

[features]
# Let the host test harness use its own allocator. Bare metal always uses the kernel heap.
host-test = []
