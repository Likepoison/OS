<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceTutor——操作系统实验评测与智能诊断平台</title>
<link rel="icon" href="/pet/whale-girl.png" type="image/png">
<link rel="preload" href="/pet/companion.js" as="script">
<style>
:root {
  color-scheme: light;
  --ink: oklch(.25 .029 265); --muted: oklch(.47 .038 265);
  --line: oklch(.90 .015 265); --paper: oklch(1 0 0); --canvas: oklch(.978 .008 265);
  --soft: oklch(.952 .016 266); --indigo: oklch(.46 .093 269);
  --teal: oklch(.43 .078 175); --teal-bg: oklch(.95 .028 173);
  --amber: oklch(.43 .084 66); --amber-bg: oklch(.96 .033 83);
  --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  --editor-paper: oklch(.987 .008 266);
  --editor-font: var(--mono);
  --editor-tab: 4;
  --backdrop: #e7eef6;
  --pattern: rgba(39, 80, 128, .11);
}
:root[data-theme="sage"] {
  --ink: #203831; --muted: #465c53; --line: #ccdcd4; --paper: #fcfefa;
  --canvas: #edf3ee; --soft: #e5eee7; --indigo: #295e4e;
  --editor-paper: #f3f8f1; --backdrop: #dfece3; --pattern: rgba(29, 94, 70, .13);
}
:root[data-theme="slate"] {
  --ink: #243044; --muted: #4b566b; --line: #cfd7e2; --paper: #fcfcfe;
  --canvas: #eceef4; --soft: #e6eaf4; --indigo: #4b527c;
  --editor-paper: #f2f3f8; --backdrop: #e2e6f2; --pattern: rgba(64, 76, 121, .13);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; color: var(--ink); background: var(--canvas); font: 18px/1.5 system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
body[data-backdrop="grid"] {
  background-image: linear-gradient(105deg, var(--backdrop), transparent 74%),
    linear-gradient(var(--pattern) 1px, transparent 1px), linear-gradient(90deg, var(--pattern) 1px, transparent 1px);
  background-size: auto, 28px 28px, 28px 28px;
}
body[data-backdrop="waves"] {
  background-image: repeating-radial-gradient(ellipse at 92% 7%, transparent 0 16px, var(--pattern) 17px, transparent 18px 31px),
    linear-gradient(115deg, var(--canvas) 14%, var(--backdrop) 100%);
}
body[data-backdrop="dots"] {
  background-image: radial-gradient(var(--pattern) 1.2px, transparent 1.5px), linear-gradient(155deg, var(--backdrop), transparent 62%);
  background-size: 21px 21px, auto;
}
body[data-backdrop="custom"] {
  background-image: linear-gradient(color-mix(in srgb, var(--canvas) 40%, transparent),
    color-mix(in srgb, var(--canvas) 55%, transparent)), var(--user-backdrop);
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
}
button, input, select, textarea { font: inherit; color: inherit; }
input::file-selector-button { font: inherit; }
small, sub, sup { font-size: 1em; }
button, select, a { -webkit-tap-highlight-color: transparent; }
button, select { cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--indigo); outline-offset: 3px;
}
a { color: var(--indigo); }
[hidden] { display: none !important; }
header { background: var(--paper); border-bottom: 1px solid var(--line); }
.bar, main { max-width: 1920px; margin: auto; padding-inline: clamp(16px, 2.35vw, 44px); }
.bar { min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; column-gap: 22px; }
.brand { display: flex; align-items: center; gap: 11px; font-weight: 750; font-size: 22px; letter-spacing: -.025em; }
.mark { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--indigo); color: white; font: 600 18px var(--mono); }
nav { display: flex; gap: 22px; align-self: stretch; }
.tab { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 0 2px; min-height: 41px; color: var(--muted); white-space: nowrap; }
.tab[aria-pressed="true"] { border-bottom-color: var(--indigo); color: var(--indigo); font-weight: 680; }
.tab:hover { color: var(--indigo); }
.quote { flex: 1 1 18rem; min-width: 0; margin: 0 0 0 auto; overflow-x: auto;
  overscroll-behavior-inline: contain; color: var(--muted); line-height: 1.5; }
.quote-line { display: block; width: max-content; margin-inline-start: auto; white-space: nowrap; }
.quote a { display: block; text-align: end; text-decoration: none; font-weight: 650; }
.quote a:hover { text-decoration: underline; }
.header-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
main { padding-block: 22px 36px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 40px; line-height: 1.2; letter-spacing: -.035em; }
h2 { font-size: 22px; letter-spacing: -.015em; }
h3 { font-size: 20px; }
.intro { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; }
.intro p { color: var(--muted); margin-top: 5px; }
.labbar { display: flex; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 15px; background: var(--paper); margin-bottom: 14px; }
select, input[type="search"] { border: 1px solid var(--line); border-radius: 7px; background: var(--paper); padding: 7px 10px; }
#summary { color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 1.14fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); }
.grid > .panel { display: flex; flex-direction: column; height: clamp(450px, 73dvh, 760px); }
.grid .panel-head, .grid .panel-foot, .result-nav { flex: none; }
.panel-head, .panel-foot { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.grid .panel-head { min-height: 60px; }
.panel-head { border-bottom: 1px solid var(--line); }
.panel-foot { border-top: 1px solid var(--line); }
.tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.button { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink); }
.button:hover:not(:disabled) { background: var(--soft); }
.primary { background: var(--indigo); color: white; border-color: var(--indigo); padding: 8px 14px; font-weight: 650; }
.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--indigo) 89%, black); }
.editor { display: flex; background: var(--editor-paper); min-height: 0; flex: 1; }
#numbers { color: var(--muted); background: var(--soft); margin: 0; padding: 13px 10px; overflow: hidden; text-align: right; min-width: 38px; border-right: 1px solid var(--line); user-select: none; }
#source, #numbers { font: var(--editor-size, 18px)/1.58 var(--editor-font); tab-size: var(--editor-tab); }
#source { width: 100%; flex: 1; min-width: 0; background: transparent; padding: 13px 14px; border: 0; resize: none; white-space: pre; }
.editor[data-wrap="true"] #source { white-space: pre-wrap; overflow-wrap: anywhere; }
.editor[data-wrap="true"] #numbers { display: none; }
.editor[data-tone="neutral"] { background: #fafafa; }
.editor[data-tone="wash"] { background: var(--soft); }
.status { padding: 3px 8px; font-weight: 650; border-radius: 6px; background: var(--soft); color: var(--indigo); }
.status.good { background: var(--teal-bg); color: var(--teal); }
.status.warn { background: var(--amber-bg); color: var(--amber); }
.result-nav { padding-inline: 17px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 0 clamp(8px, 2vw, 22px); }
.review-steps, .check-list { display: grid; gap: 10px; margin-block: 12px; }
.review-steps { padding-left: 30px; }
.review-steps li, .check-list li { padding: 10px 13px; border: 1px solid var(--line); border-radius: 9px; }
.review-steps li p, .check-list li p { margin-top: 4px; }
.review-steps .tool-row { margin-top: 8px; }
.check-list { list-style: none; padding: 0; }
.check-list header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
#demo-check { width: min(630px, calc(100vw - 32px)); }
#contents { flex: 1; min-height: 0; overflow: auto; padding: 14px; }
#contents:has(> .empty) { display: grid; }
.empty { display: grid; min-height: min(100%, 220px); align-content: center; justify-items: center; text-align: center; gap: 8px; padding: 26px 14px; }
.empty p, .muted { color: var(--muted); }
.empty-mark { width: 46px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--soft); color: var(--indigo); font: 20px var(--mono); margin-bottom: 5px; }
.finding { padding: 13px 14px; border-radius: 9px; background: var(--soft); margin-bottom: 13px; }
.finding.warn { background: var(--amber-bg); }
.finding p { margin-top: 3px; }
.finding button { margin-top: 8px; }
.case { padding: 10px 1px; border-bottom: 1px solid var(--line); }
.case summary, .hint summary { cursor: pointer; font-weight: 630; }
.case pre, .event pre { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; font: 18px/1.55 var(--mono); margin: 6px 0; }
.case pre { background: var(--canvas); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 200px; overflow: auto; }
.case .muted { display: inline-block; margin-top: 6px; }
.trace-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.trace-tools input { min-width: 120px; flex: 1; }
.event-list { max-height: 405px; overflow: auto; }
.event { border-bottom: 1px solid var(--line); padding: 8px 7px; min-width: 0; }
.event.evidence { outline: 1px solid var(--line); outline-offset: -1px; background: var(--soft); }
.event small { color: var(--muted); font: 18px var(--mono); overflow-wrap: anywhere; }
.event-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 5px; }
.event-heading button { padding: 3px 7px; }
.event pre { margin-bottom: 0; }
.pager { margin-top: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
.hint { padding: 13px 0; border-bottom: 1px solid var(--line); }
.hint p { padding: 8px 0 0; color: var(--muted); }
.notice { color: var(--amber); margin-top: 11px; overflow-wrap: anywhere; }
.ai-option { color: var(--muted); }
.preferences { width: min(420px, calc(100vw - 24px)); padding: 15px; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 38px #25395524; }
.preferences h2 { margin-bottom: 9px; }
.preferences label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-block: 7px; }
.preferences select { min-width: 143px; }
.preferences input[type="file"] { max-width: 100%; }
.preferences .file-label { display: block; }
#background-note { margin-block: 4px 9px; }
.preferences .close-preferences { display: flex; justify-content: flex-end; padding-top: 8px; }
.quick-study { display: flex; flex-wrap: wrap; gap: 6px; }
.quick-study .button { background: var(--paper); }
.quick-study .button:hover { background: var(--soft); }
#counts { display: flex; flex-wrap: wrap; gap: 8px; padding: 13px 17px; border-bottom: 1px solid var(--line); }
#records { overflow-x: auto; }
#comparison { padding: 15px 17px; border-bottom: 1px solid var(--line); }
.comparison-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 9px; }
.comparison-entry { border: 1px solid var(--line); border-radius: 8px; padding: 11px; }
.comparison-entry p { margin: 5px 0; }
.comparison-entry button { margin: 6px 6px 0 0; }
.comparison-cases { padding-left: 20px; margin: 8px 0; }
.comparison-cases li + li { margin-top: 4px; }
@media (max-width: 540px) { .comparison-grid { grid-template-columns: 1fr; } }
table { border-collapse: collapse; width: 100%; text-align: left; }
th, td { white-space: nowrap; padding: 10px 17px; border-bottom: 1px solid var(--line); }
th { background: var(--canvas); color: var(--muted); font-weight: 620; }
td code { font: 18px var(--mono); }
.pet-launch { --pet-edge: 14px; --pet-bottom: 8px; --pet-size: clamp(124px, 19dvh, 205px);
  position: fixed; z-index: 3; left: calc(100% - var(--pet-edge) - var(--pet-size));
  top: calc(100% - var(--pet-bottom) - var(--pet-size)); width: var(--pet-size); height: var(--pet-size);
  display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent;
  cursor: grab; touch-action: none; user-select: none; }
.pet-launch.dragging { cursor: grabbing; }
.pet-launch:disabled { opacity: 1; }
.pet-figure { display: block; width: 100%; height: 100%; pointer-events: none;
  --cycle: 2.6s; position: relative; overflow: hidden;
  transform-origin: 50% 86%; filter: drop-shadow(0 3px 3px #23365b30); }
.pet-stand { display: block; width: 100%; height: 100%; object-fit: contain; }
.pet-strip { position: absolute; top: 0; left: 0; width: 800%; height: 100%; max-width: none; }
.pet-launch[data-art] .pet-stand { visibility: hidden; }
.pet-launch[data-facing="left"] .pet-figure { transform: scaleX(-1); }
.pet-launch[data-pose="greet"] .pet-figure { --cycle: 1.4s; }
.pet-launch[data-pose="walk"] .pet-figure { --cycle: .68s; }
.pet-launch[data-pose="listen"] .pet-figure { --cycle: 1.8s; }
.pet-launch[data-pose="talk"] .pet-figure { --cycle: .95s; }
.pet-launch[data-pose="sit"] .pet-figure { --cycle: 2.5s; }
.pet-launch[data-pose="snack"] .pet-figure { --cycle: 2.1s; }
.pet-launch[data-pose="play"] .pet-figure { --cycle: 1.05s; }
.pet-launch[data-pose="look"] .pet-figure { --cycle: 2.0s; }
.pet-launch[data-pose="sleep"] .pet-figure { --cycle: 3.2s; }
.pet-launch[data-pose="focus"] .pet-figure { --cycle: 2.2s; }
.pet-launch[data-pose="drag"] .pet-figure { --cycle: .8s; }
@media (prefers-reduced-motion: no-preference) {
  .pet-launch[data-roaming="true"] { transition: left 1.85s ease-in-out, top 1.85s ease-in-out; }
  .pet-launch[data-motion="true"][data-art] .pet-strip { animation: pet-frames var(--cycle) steps(8, jump-none) infinite; }
  .pet-launch[data-motion="true"][data-art="look"][data-gaze="pointer"] .pet-strip {
    animation: none; transform: translateX(var(--gaze-frame, 0%));
  }
  .pet-launch[data-motion="true"]:not([data-art]):is([data-pose="stand"], [data-pose="listen"], [data-pose="focus"]) .pet-figure {
    animation: pet-breathe 2.8s ease-in-out infinite;
  }
  .pet-launch[data-motion="true"]:not([data-art]):is([data-pose="greet"], [data-pose="look"], [data-pose="talk"]) .pet-figure {
    animation: pet-hello 1.4s ease-in-out;
  }
  .pet-launch[data-motion="true"]:not([data-art]):is([data-pose="walk"], [data-pose="play"]) .pet-figure {
    animation: pet-step .55s ease-in-out infinite;
  }
  .pet-launch[data-motion="true"]:not([data-art]):is([data-pose="sit"], [data-pose="sleep"]) .pet-figure {
    scale: 1 .94; animation: pet-breathe 3.2s ease-in-out infinite;
  }
  .pet-launch[data-motion="true"][data-pose="snack"] .pet-strip { animation-iteration-count: 1; animation-fill-mode: forwards; }
  .pet-launch[data-motion="true"]:hover .pet-figure { filter: drop-shadow(0 5px 8px #365ad267); }
}
@keyframes pet-frames { from { transform: translateX(0); } to { transform: translateX(-87.5%); } }
@keyframes pet-hello { 20%, 70% { rotate: -7deg; translate: 0 -5px; } 45% { rotate: 5deg; } }
@keyframes pet-step { 50% { translate: 0 -7px; rotate: 3deg; } }
@keyframes pet-breathe { 50% { translate: 0 -2px; } }
.pet-panel { position: fixed; z-index: 4; width: min(425px, calc(100vw - 24px));
  max-height: calc(100dvh - 24px); overflow: auto; overscroll-behavior: contain;
  padding: 15px; border: 1px solid var(--line); border-radius: 17px;
  background: var(--paper); box-shadow: 0 10px 28px oklch(.30 .05 266 / .16); }
.pet-bubble { position: fixed; z-index: 2; width: min(312px, calc(100vw - 24px));
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
  box-shadow: 0 4px 18px oklch(.30 .05 266 / .10); pointer-events: none; }
.pet-bubble[data-kind="spoken"] { z-index: 5; }
.pet-bubble:not([style]) { right: 15px; bottom: min(calc(19dvh + 17px), 224px); }
.pet-head, .pet-form { display: flex; align-items: center; gap: 8px; }
.pet-head { justify-content: space-between; }
.pet-head h2 { margin: 0; }
.pet-reply { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.pet-panel .tool-row { margin-bottom: 10px; }
.pet-form input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px; }
.pet-form button { flex: none; }
#pet-heard { margin-top: 6px; overflow-wrap: anywhere; }
.pet-voice { margin: 8px 0 0; }
.pet-voice .tool-row { margin-bottom: 3px; }
.pet-mic-device { display: flex; align-items: center; gap: 8px; margin-block: 6px; }
.pet-mic-device select { flex: 1; min-width: 0; }
.pet-quiz { margin: 10px 0; padding: 0; border: 0; min-width: 0; }
.pet-quiz legend { font-weight: 650; margin-bottom: 6px; padding: 0; }
.pet-quiz button { display: flex; width: 100%; margin-bottom: 5px; text-align: left; }
.pet-quiz button:disabled { cursor: default; }
.pet-help { margin-top: 9px; }
.pet-controls { display: flex; flex-wrap: wrap; gap: 12px; }
.preferences::backdrop { background: #26395640; }
@media (max-width: 1120px) {
  .quote { order: 1; margin: 0; flex-basis: 100%; padding-bottom: 8px; }
  .quote-line { margin-inline-start: 0; }
  .header-tools { margin-left: auto; }
}
@media (max-width: 850px) {
  .grid { grid-template-columns: 1fr; }
  .editor { height: 370px; flex: none; }
  .bar, main { padding-inline: 20px; }
  .grid > .panel { height: auto; }
  #contents { min-height: 230px; }
}
@media (max-width: 540px) {
  .bar { column-gap: 14px; padding-top: 8px; }
  .bar > nav { order: 2; width: 100%; }
  main { padding-top: 23px; }
  h1 { font-size: 32px; }
  .labbar { flex-wrap: wrap; gap: 5px; }
  .panel-head, .panel-foot, #contents { padding-inline: 13px; }
  .pet-launch { --pet-size: clamp(104px, 15dvh, 146px); --pet-edge: 8px; }
  .pet-bubble:not([style]) { right: 9px; bottom: min(calc(15dvh + 17px), 165px); }
}
</style>
</head>
<body data-backdrop="grid">
<header><div class="bar">
  <div class="brand"><span class="mark" aria-hidden="true">&gt;_</span>TraceTutor</div>
  <nav aria-label="页面">
    <button type="button" class="tab" id="work-tab" aria-pressed="true">实验工作台</button>
    <button type="button" class="tab" id="history-tab" aria-pressed="false">实验记录</button>
  </nav>
  <blockquote class="quote" id="quote" tabindex="0" aria-label="计算机名人引语" hidden>
    <span class="quote-line"><span id="quote-text"></span><a id="quote-source" target="_blank" rel="noopener noreferrer"></a></span>
  </blockquote>
  <div class="header-tools">
    <button type="button" class="button" id="demo-check-open">演示自检</button>
    <button type="button" class="button" id="appearance-open">外观设置</button>
    <button type="button" class="button" id="pet-restore" hidden>显示助教</button>
  </div>
</div></header>
<main>
<section id="workspace" aria-labelledby="work-title">
  <div class="intro">
    <div><h1 id="work-title">操作系统实验工作台</h1><p>从测试判定追溯到系统调用，逐层查看排查提示。</p></div>
    <div class="quick-study" id="quick-study" aria-label="助教学习工具" role="group">
      <button class="button" type="button" data-study="chat" disabled>问助教</button>
      <button class="button" type="button" data-study="voice" aria-keyshortcuts="T" disabled>语音提问</button>
      <button class="button" type="button" data-study="quiz" disabled>概念小测</button>
      <button class="button" type="button" data-study="progress" disabled>学习进度</button>
    </div>
  </div>
  <div class="labbar">
    <label for="lab"><strong>实验</strong></label><select id="lab"></select><p id="summary"></p>
  </div>
  <div class="grid">
    <section class="panel" aria-labelledby="code-title">
      <div class="panel-head"><h2 id="code-title">源代码 <span class="muted">· main.c</span></h2>
        <div class="tool-row"><button class="button" id="editor-open" type="button">代码样式</button><button class="button" id="good" type="button">正确样例</button><button class="button" id="bad" type="button">故障样例</button></div>
      </div>
      <div class="editor"><pre id="numbers" aria-hidden="true">1</pre><textarea id="source" aria-label="C 源代码" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea></div>
      <div class="panel-foot"><label class="ai-option"><input type="checkbox" id="ai" disabled> 请求 AI 提示</label>
        <button class="button primary" id="run" type="button" disabled>运行实验 <span aria-hidden="true">→</span></button>
      </div>
    </section>
    <section class="panel" aria-labelledby="result-title">
      <div class="panel-head"><h2 id="result-title">运行分析</h2><span class="status" id="status" role="status">待提交</span></div>
      <nav aria-label="运行分析" class="result-nav">
        <button class="tab" data-tab="grade" type="button" aria-pressed="true">测试判定</button>
        <button class="tab" data-tab="trace" type="button" aria-pressed="false">系统调用</button>
        <button class="tab" data-tab="hints" type="button" aria-pressed="false">分层提示</button>
        <button class="tab" data-tab="review" type="button" aria-pressed="false">诊断复盘</button>
      </nav>
      <div id="contents"></div>
    </section>
  </div>

<script>
const byId = id => document.getElementById(id);
const source = byId("source"), select = byId("lab"), contents = byId("contents");
const quotes = [
  ["程序测试能发现错误，却无法证明错误不存在。", "艾兹格·迪杰斯特拉", "https://www.cs.utexas.edu/~EWD/transcriptions/EWD02xx/EWD273.html"],
  ["回想起来，我们别无选择，只能做开拓者。", "玛格丽特·汉密尔顿", "https://news.mit.edu/2026/margaret-hamilton-computing-pioneer-dies-1007"],
  ["我想探讨这个问题：机器能思考吗？", "艾伦·图灵", "https://doi.org/10.1093/mind/LIX.236.433"]
];
const [quoteText, quoteAuthor, quoteURL] = quotes[Math.floor(Math.random() * quotes.length)];
byId("quote-text").textContent = "“" + quoteText + "”";
byId("quote-source").textContent = "— " + quoteAuthor;
byId("quote-source").title = "查看原文";
byId("quote-source").href = quoteURL;
byId("quote").hidden = false;
const labels = {
  queued:"排队中", running:"编译与运行中", analyzing:"分析证据中", finished:"评测完成",
  platform_error:"平台运行失败", interrupted:"服务已中断", passed:"通过", wrong_output:"输出不符",
  compile_error:"编译失败", compile_timeout:"编译超时", runtime_error:"异常退出", signal_exit:"信号终止",
  trace_error:"采集异常", timeout:"运行超时",
  oom:"内存超限", output_limit:"日志达到上限", missing_behavior:"缺少要求的调用",
  pipe_wait:"管道 EOF 等待", file_error:"文件操作错误", memory_limit:"内存超限", sync_wait:"同步等待"
};
let labs = [], record, tab = "grade", polling = false, caseIndex = 0, onlyEvidence = false, viewVersion = 0;
let historyVersion = 0, pair = [];
let companion, voiceConfig;
const el = (tag, text, cls) => {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
};
function button(text, click) {
  const b = el("button", text, "button");
  b.type = "button";
  b.addEventListener("click", click);
  return b;
}
async function api(path, options) {
  const previewHint = "连接评测服务失败。请确认 Codespace 正在运行，并从 Ports 重新打开私有预览。";
  let rs;
  try { rs = await fetch(path, options); }
  catch (error) {
    if (error.name === "AbortError" || error.name === "TimeoutError") throw error;
    throw new Error(previewHint);
  }
  if (rs.redirected || rs.status === 401 || rs.status === 403) throw new Error(previewHint);
  const data = await rs.json().catch(() => null);
  if (!data) throw new Error(previewHint);
  if (!rs.ok) throw Object.assign(new Error(data.error || "请求失败"), {status: rs.status});
  return data;
}
function notice(message = "") {
  byId("notice").textContent = message;
  byId("notice").hidden = !message;
}
function lines() {
  const gutter = byId("numbers");
  gutter.textContent = Array.from({length: source.value.split("\n").length}, (_, i) => i + 1).join("\n");
  gutter.scrollTop = source.scrollTop;
}
function setupPreferences() {
  byId("appearance-open").addEventListener("click", () => byId("appearance").showModal());
  byId("editor-open").addEventListener("click", () => byId("editor-settings").showModal());
  byId("theme").addEventListener("change", event => {
    document.documentElement.dataset.theme = event.target.value;
  });
  const backdrop = byId("backdrop");
  const backgroundFile = byId("background-file");
  const backgroundNote = byId("background-note");
  backdrop.addEventListener("change", () => { document.body.dataset.backdrop = backdrop.value; });
  backgroundFile.addEventListener("change", () => {
    const file = backgroundFile.files[0];
    if (!file) return;
    if (!["image/png", "image/jpeg", "image/webp"].includes(file.type) || file.size > 5 * 1024 * 1024) {
      backgroundNote.textContent = "请选择不超过 5 MB 的 PNG、JPG 或 WebP 图片。";
      return;
    }
    const failed = () => {
      if (backgroundFile.files[0] === file) backgroundNote.textContent = "图片无法打开，请换一张试试。";
    };
    const reader = new FileReader();
    reader.addEventListener("error", failed);
    reader.addEventListener("load", async () => {
      try {
        const image = new Image();
        image.src = reader.result;
        await image.decode();
      } catch {
        failed();
        return;
      }
      if (backgroundFile.files[0] !== file) return;
      document.body.style.setProperty("--user-backdrop", 'url("' + reader.result + '")');
      if (!backdrop.querySelector('[value="custom"]')) backdrop.add(new Option("自定义图片", "custom"));
      backdrop.value = document.body.dataset.backdrop = "custom";
      backgroundNote.textContent = "已应用图片，关闭或刷新页面后会清除。";
    });
    reader.readAsDataURL(file);
  });
  const editor = source.parentElement;
  const fonts = {system: "var(--mono)", consolas: 'Consolas, "SFMono-Regular", monospace',
    courier: '"Courier New", Courier, monospace'};
  byId("editor-settings").addEventListener("change", () => {
    editor.style.setProperty("--editor-font", fonts[byId("editor-font").value]);
    editor.style.setProperty("--editor-size", byId("editor-size").value + "px");
    editor.style.setProperty("--editor-tab", byId("editor-tab").value);
    editor.dataset.tone = byId("editor-tone").value;
    editor.dataset.wrap = String(byId("editor-wrap").checked);
    source.wrap = byId("editor-wrap").checked ? "soft" : "off";
    lines();
  });
}
function loadExample(broken) {
  const lab = labs.find(item => item.id === select.value);
  if (!lab) return;
  source.value = broken ? lab.broken : lab.sample;
  source.scrollTop = 0;
  byId("summary").textContent = lab.summary;
  lines();
  if (!polling) byId("run").disabled = false;
}
function navigate(history) {
  byId("workspace").hidden = history;
  byId("history").hidden = !history;
  byId("work-tab").setAttribute("aria-pressed", String(!history));
  byId("history-tab").setAttribute("aria-pressed", String(history));
  companion?.observe(history ? "history" : tab);
  if (history) refreshHistory();
}
function showTab(next, initialTracePage = 0, traceFocus) {
  tab = next;
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === next)));
  render(initialTracePage, traceFocus);
}
function showFindingTrace(result, eventId) {
  caseIndex = result.evidence_case;
  onlyEvidence = result.diagnosis.evidence.length > 0 && result.diagnosis.confidence !== "insufficient";
  showTab("trace", onlyEvidence ? 0 : "last", eventId);
}
function traceActionLabel(result) {
  if (!result.cases[result.evidence_case]?.trace_available) return "";
  if (result.diagnosis.evidence.length && result.diagnosis.confidence !== "insufficient") return "查看关联事件";
  return result.passed !== result.total ? "查看末尾轨迹" : "";
}
function petSnapshot(run) {
  if (!run) return null;
  const result = run.result;
  return {
    id: run.id,
    lab: run.lab,
    state: run.state,
    hasResult: Boolean(result),
    passed: Boolean(result && result.scored !== false && result.passed === result.total),
    score: result?.scored !== false && result ? [result.passed, result.total] : null,
    code: result?.diagnosis.code,
    confidence: result?.diagnosis.confidence,
    ai: result?.feedback.source === "ai",
    traceLabel: result ? traceActionLabel(result) : ""
  };
}
function openPetResult(id, kind) {
  if (id !== record?.id || !record.result) return;
  navigate(false);
  if (kind === "trace") showFindingTrace(record.result);
  else showTab(kind);
  document.querySelector('[data-tab="' + kind + '"]').focus();
}
const diagnosisConfidence = {confirmed:"已确认", suspected:"疑似", insufficient:"证据不足"};
function render(initialTracePage = 0, traceFocus) {
  companion?.update(petSnapshot(record));
  companion?.observe(byId("workspace").hidden ? "history" : tab);
  const version = ++viewVersion;
  contents.replaceChildren();
  const result = record?.result;
  const badge = byId("status");
  badge.textContent = labels[record?.state] || "待提交";
  badge.className = "status";
  if (!result) {
    const interrupted = record?.outcome === "interrupted";
    if (record?.state === "platform_error") badge.classList.add("warn");
    const box = el("div", undefined, "empty");
    box.append(el("span", "↳", "empty-mark"),
      el("h3", interrupted ? labels.interrupted : record ? (labels[record.state] || "运行中") : "等待一次实验运行"),
      el("p", interrupted ? "服务重启中断了本次运行，请重新提交实验。"
      : record?.state === "platform_error" ? "请在演示终端检查 Docker 服务与镜像，再重新运行。"
      : record ? "任务在独立容器执行，结果会自动更新。" : "运行左侧代码，在这里查看用例、轨迹和提示。"));
    contents.append(box);
    return;
  }
  const scored = result.scored !== false;
  const ok = scored && result.passed === result.total;
  badge.textContent = scored ? result.passed + " / " + result.total + " 通过" : "采集异常 · 本次不计分";
  badge.classList.add(ok ? "good" : "warn");
  if (tab === "trace") {
    traceView(result, version, initialTracePage, traceFocus);
    return;
  }
  if (tab === "review") {
    reviewView(record, version);
    return;
  }
  if (tab === "hints") {
    const fb = result.feedback;
    const src = fb.source === "ai" ? "AI · " + fb.model : "规则提示" + (fb.reason ? " · " + fb.reason : "");
    contents.append(el("p", src, "muted"));
    fb.hints.forEach((hint, i) => {
      const item = el("details", undefined, "hint");
      item.open = i === 0;
      item.append(el("summary", ["观察方向", "相关原理", "证据定位"][i]), el("p", hint));
      contents.append(item);
    });
    if (traceActionLabel(result)) contents.append(button(traceActionLabel(result), () => showFindingTrace(result)));
    return;
  }
  const diagnosis = result.diagnosis;
  const box = el("div", undefined, ok ? "finding" : "finding warn");
  box.append(el("h3", diagnosis.title));
  const assessedLab = labs.find(l => l.id === record.lab);
  if (assessedLab && record.lab !== select.value) box.append(el("p", "本条记录 · " + assessedLab.title));
  if (!ok) box.append(el("p", diagnosisConfidence[diagnosis.confidence] + " · " +
    (diagnosis.evidence.length ? "关联 " + diagnosis.evidence.length + " 条轨迹事件" : "依据测试判定")));
  if (diagnosis.detail) box.append(el("p", diagnosis.detail));
  if (traceActionLabel(result)) box.append(button(traceActionLabel(result), () => showFindingTrace(result)));
  contents.append(box);
  result.cases.forEach((test, i) => {
    const details = el("details", undefined, "case");
    details.dataset.caseIndex = i;
    details.open = i === result.evidence_case && !ok;
    const elapsed = test.duration_ms === undefined ? "" : " · " + test.duration_ms + " ms";
    details.append(el("summary", test.name + " · " + (labels[test.status] || test.status) + elapsed));
    const code = test.compile;
    if (test.status === "compile_error" || test.status === "compile_timeout") {
      details.append(el("pre", code.stderr || "编译过程未正常结束"));
    }
    else {
      if (test.stdin !== undefined) details.append(el("p", "用例输入", "muted"), el("pre", test.stdin || "（空输入）"));
      const expectedLabel = ["mutex", "deadlock"].includes(record.lab) ? "预期输出（工作线程行顺序不限）" : "预期输出";
      details.append(el("p", expectedLabel, "muted"), el("pre", test.expected || "（空输出）"));
      details.append(el("p", "实际输出", "muted"), el("pre", test.stdout || "（空输出）"));
      if (test.stderr) details.append(el("pre", test.stderr));
    }
    contents.append(details);
  });
}
function traceView(result, version, initialPage, traceFocus) {
  const tools = el("div", undefined, "trace-tools"), picker = el("select");
  picker.setAttribute("aria-label", "轨迹用例");
  result.cases.forEach((test, i) => {
    const o = el("option", test.name);

  });
  picker.value = caseIndex;
  const search = el("input"), events = el("div", undefined, "event-list"), pager = el("div", undefined, "pager");
  search.type = "search"; search.placeholder = "查调用、PID 或 errno"; search.setAttribute("aria-label", "搜索轨迹");
  const base = "/api/runs/" + record.id;
  const raw = el("a", "原始日志"); raw.target = "_blank"; raw.rel = "noopener";
  const filter = button(onlyEvidence ? "显示全部" : "只看证据", () => {
    onlyEvidence = !onlyEvidence; showTab("trace");
  });

  raw.href = base + "/raw/" + caseIndex;

  tools.append(picker, search, filter, raw);
  contents.append(tools);

  async function load(page) {
    const seq = ++requests;

      page, q: search.value, only: onlyEvidence && !search.value ? "evidence" : "all"
    });
    try {
      const data = await api(path);
      if (seq !== requests || version !== viewVersion) return;
      events.replaceChildren();
      pager.replaceChildren();
      if (!byId("workspace").hidden) companion?.observe("trace", data.total);
      if (!data.events.length) events.append(el("p", "没有匹配的轨迹事件。", "muted"));
      for (const ev of data.events) {
        const linked = caseIndex === result.evidence_case && result.diagnosis.evidence.includes(ev.id);
        const row = el("article", undefined, linked ? "event evidence" : "event");
        const heading = el("div", undefined, "event-heading");
        const sourceLines = ev.lines.join("、");
        heading.append(el("small", "#" + ev.id + " · PID/TID " + ev.pid + " · 原日志行 " + sourceLines +
          (ev.duration_us != null ? " · " + ev.duration_us + " µs" : "")));
        if (ev.call) {
          const ask = button("问助教", () => companion?.explain({
            id: ev.id, call: ev.call, kind: ev.kind, errno: ev.errno

      const next = button("下一页", () => load(data.page + 1));
      previous.disabled = data.page === 0; next.disabled = (data.page + 1) * 40 >= data.total;

function openReviewTarget(run, target, index) {
  if (polling) return notice("请等当前实验运行结束。");

  if (target === "trace") return showFindingTrace(run.result, index);
  showTab(target);
  if (target === "grade") {
    const test = contents.querySelector('[data-case-index="' + index + '"]');
    if (test) {
      test.open = true;
      test.querySelector("summary").focus();
    }
  }
}

async function reviewView(current, version) {
  const adjacent = id => api("/api/runs/" + id, {signal: AbortSignal.timeout(10000)});
  const message = el("p", "正在整理本次用例、轨迹与复跑结果…", "muted");
  contents.append(message);
  let before = current, after, memoryError, evidenceError, events = [];
  try {
    const study = (await companion?.reviewRuns(current.lab))?.study;
    const runs = study?.recent_runs || [];
    const index = runs.findIndex(run => run.id === current.id);
    if (index > -1 && current.result.passed === current.result.total) {
      const failed = runs.slice(0, index).reverse().find(run => run.score[0] < run.score[1]);
      if (failed) {
        const earlier = await adjacent(failed.id);
        if (earlier.lab === current.lab && earlier.result?.scored !== false && earlier.result?.passed < earlier.result?.total) {
          before = earlier;
          after = current;
        }

      const later = await adjacent(runs[index + 1].id);

    }
  } catch (error) { memoryError = error.message; }
  if (version !== viewVersion) return;
  const {result} = before;
  const caseIndex = result.evidence_case;
  const test = result.cases[caseIndex];
  const diagnosis = result.diagnosis;
  const linked = test?.trace_available && diagnosis.evidence.length && diagnosis.confidence !== "insufficient";
  if (linked) {
    try {
      const data = await api("/api/runs/" + before.id + "/events/" + caseIndex + "?only=evidence",
                             {signal: AbortSignal.timeout(10000)});
      events = data.events;
    } catch (error) { evidenceError = error.message; }
  }
  if (version !== viewVersion) return;

  const steps = el("ol", undefined, "review-steps");
  function step(title, detail, actions = []) {
    const item = el("li");
    item.append(el("h3", title), el("p", detail));
    if (actions.length) {
      const row = el("div", undefined, "tool-row");
      row.append(...actions);
      item.append(row);
    }
    steps.append(item);
  }
  const passed = result.scored !== false && result.passed === result.total;
  const testLabel = test ? test.name + " · " + (labels[test.status] || test.status) : "暂无用例结果。";
  step(passed ? "用例结果" : "用例判定", testLabel,
       test ? [button("打开该用例", () => openReviewTarget(before, "grade", caseIndex))] : []);
  const traceLinks = events.map(event => button("#" + event.id + " · " + (event.call || event.kind),
    () => openReviewTarget(before, "trace", event.id)));
  const traceLabel = traceActionLabel(result);
  if (!traceLinks.length && traceLabel) traceLinks.push(button(traceLabel, () => openReviewTarget(before, "trace")));
  const confidence = diagnosisConfidence[diagnosis.confidence];
  step("系统调用证据", events.length ? confidence + " · " + events.length + " 条关联事件。"
    : evidenceError ? "轨迹摘要读取失败，可尝试打开系统调用页。"
    : passed ? "本次用例全部通过。"
    : (confidence || "未确认") + " · 当前没有可直接引用的轨迹事件。", traceLinks);
  step("分层提示", result.feedback.hints[0] || "暂无观察方向。",
       [button("打开分层提示", () => openReviewTarget(before, "hints"))]);
  const retest = after?.result.cases.find(item => item.name === test?.name);
  const comparison = after
    ? result.passed + "/" + result.total + " → " + after.result.passed + "/" + after.result.total + " 用例通过。"
      + (test ? " 同一用例：" + (labels[test.status] || test.status) + " → " +
        (retest ? labels[retest.status] || retest.status : "未运行") + "。" : "")
    : memoryError ? "本页复跑记录暂不可用。"
    : "继续在当前网页修改并重跑同一实验，即可对照后一次结果。";
  step("复跑对照", comparison, after ? [button("打开后一次运行", () => openReviewTarget(after, "grade",
       retest ? after.result.cases.indexOf(retest) : after.result.evidence_case))] : []);
  contents.replaceChildren(el("p", "诊断：" + diagnosis.title, "muted"), steps);
  if (memoryError || evidenceError) contents.append(el("p", memoryError || evidenceError, "notice"));
}

async function track(id, submission = false) {
  polling = true;
  byId("run").disabled = true;
  try {
    for (let attempt = 0; attempt < 160; attempt++) {
      record = await api("/api/runs/" + id);
      if (record.result || record.state === "platform_error") {
        if (submission) companion?.recordRun(petSnapshot(record));
        caseIndex = record.result?.evidence_case || 0;
        showTab("grade");
        return;
      }
      render();
      await new Promise(resolve => setTimeout(resolve, 500));
    }
    notice("任务尚未返回，请通过实验记录继续查看。");
  } catch (err) { notice(err.message); }
  finally {
    polling = false;
    byId("run").disabled = false;
  }
}
async function openRecord(id, openTrace = false) {
  if (polling) {
    navigate(false);
    notice("当前实验运行结束后可打开历史记录。");
    return;
  }
  navigate(false);
  notice();
  onlyEvidence = false;
  await track(id);
  if (openTrace && record?.id === id && record.result) showFindingTrace(record.result);
}

async function compareRuns() {
  const version = historyVersion, panel = byId("comparison"), control = byId("compare");
  if (pair.length !== 2) return;
  control.disabled = true;
  panel.hidden = false;
  panel.replaceChildren(el("p", "正在读取两次实验记录…", "muted"));
  try {
    const runs = await Promise.all(pair.map(run => api("/api/runs/" + run.id)));
    if (historyVersion !== version) return;
    const after = runs[1];
    const name = labs.find(lab => lab.id === after.lab).title;
    const grid = el("div", undefined, "comparison-grid");
    runs.forEach((run, i) => {
      const {result} = run;
      const box = el("article", undefined, "comparison-entry");
      const evidence = result.diagnosis.evidence.length;
      const cases = el("ul", undefined, "comparison-cases");
      result.cases.forEach(test => cases.append(el("li", test.name + " · " + (labels[test.status] || test.status))));
      if (result.cases.length < result.total) cases.append(el("li", "其余用例未运行"));
      box.append(el("h3", i === 0 ? "较早一次" : "最近一次"),
        el("p", result.passed + " / " + result.total + " 用例通过 · " + result.diagnosis.title),
        cases,
        el("p", evidence ? evidence + " 条关联证据" : "无关联轨迹证据", "muted"),
        button("打开记录", () => openRecord(run.id)));
      if (traceActionLabel(result)) box.append(button(traceActionLabel(result), () => openRecord(run.id, true)));
      grid.append(box);
    });
    panel.replaceChildren(el("h2", name + " · 前后对比"), grid);
  } catch (err) {
    if (historyVersion === version) panel.replaceChildren(el("p", err.message, "notice"));
  } finally {
    if (historyVersion === version) control.disabled = false;
  }
}

async function refreshHistory() {
  const version = ++historyVersion;
  const selected = byId("filter").value;
  byId("comparison").hidden = true;
  byId("compare").disabled = true;
  pair = [];
  try {
    const data = await api("/api/runs?" + new URLSearchParams({lab:selected}));
    if (historyVersion !== version) return;
    const finished = data.runs.filter(run => run.state === "finished");
    const counts = new Map();
    for (const run of finished) counts.set(run.lab, (counts.get(run.lab) || 0) + 1);
    const comparable = finished.find(run => counts.get(run.lab) > 1);
    pair = finished.filter(run => run.lab === comparable?.lab).slice(0, 2).reverse();
    byId("compare").disabled = pair.length !== 2;
    byId("counts").replaceChildren(...data.counts.map(c => el("span", (labels[c.outcome] || c.outcome) + " · " + c.count, "status")));
    const table = el("table"), thead = el("thead"), head = el("tr"), body = el("tbody");
    ["实验", "时间", "判定", "记录编号", "操作"].forEach(t => head.append(el("th", t)));
    thead.append(head); table.append(thead, body);
    data.runs.forEach(run => {
      const row = el("tr"), slug = el("td"), action = el("td");
      slug.append(el("code", run.id.slice(0, 8)));
      action.append(button("查看", () => openRecord(run.id)));
      row.append(el("td", labs.find(l => l.id === run.lab)?.title ?? run.lab), el("td", new Date(run.created).toLocaleString()),
        el("td", labels[run.outcome] || labels[run.state] || run.state), slug, action);
      body.append(row);
    });
    byId("records").replaceChildren(data.runs.length ? table : el("div", "运行实验后，判定和轨迹会出现在这里。", "empty"));
  } catch (err) {
    if (historyVersion === version) byId("records").replaceChildren(el("p", err.message, "empty"));
  }
}
const demoDialog = byId("demo-check");
byId("demo-check-open").addEventListener("click", () => demoDialog.showModal());
byId("demo-check-run").addEventListener("click", async event => {
  const control = event.currentTarget, list = byId("demo-check-list"), status = byId("demo-check-status");
  const online = byId("demo-check-online").checked;
  const names = {ready:"通过", configured:"已配置", missing:"未配置", pending:"待检查", error:"失败"};
  control.disabled = true;
  list.replaceChildren();
  status.textContent = "正在检查，请稍候…";
  try {
    const result = await api("/api/demo-check", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({online}), signal:AbortSignal.timeout(55000)});
    for (const check of result.checks) {
      const row = el("li"), heading = el("header");
      const style = check.state === "ready" ? "status good" : check.state === "error" ? "status warn" : "status";
      heading.append(el("strong", check.name), el("span", names[check.state], style));
      row.append(heading, el("p", check.detail, "muted"));
      list.append(row);
    }
    status.textContent = "自检完成。";
  } catch (error) {
    status.textContent = error.name === "TimeoutError" ? "自检超时，请重试。" : error.message;
  } finally {
    control.disabled = false;
  }
});
byId("work-tab").addEventListener("click", () => navigate(false));
byId("history-tab").addEventListener("click", () => navigate(true));
byId("filter").addEventListener("change", refreshHistory);
byId("compare").addEventListener("click", compareRuns);
byId("good").addEventListener("click", () => loadExample(false));
byId("bad").addEventListener("click", () => loadExample(true));
select.addEventListener("change", () => loadExample(false));
source.addEventListener("input", lines);
source.addEventListener("scroll", () => { byId("numbers").scrollTop = source.scrollTop; });
source.addEventListener("keydown", event => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey) && !event.isComposing) {
    event.preventDefault();
    byId("run").click();
  }
});
setupPreferences();
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
byId("run").addEventListener("click", async () => {
  if (polling) return;
  polling = true;
  companion?.update({state:"queued"});
  notice(); byId("run").disabled = true;
  try {
    const queued = await api("/api/runs", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({lab:select.value, source:source.value, ai:byId("ai").checked})});
    onlyEvidence = false;
    await track(queued.id, true);
  } catch (err) {
    notice(err.message); polling = false; byId("run").disabled = false;
    companion?.update(petSnapshot(record));
  }
});
render();
api("/api/labs").then(data => {
  labs = data.labs;
  for (const lab of labs) {
    const option = el("option", lab.title);
    option.value = lab.id;
    select.append(option);
    byId("filter").append(option.cloneNode(true));
  }
  byId("ai").disabled = !data.ai;
  voiceConfig = {record: data.voice === true, voices: Array.isArray(data.speech_voices) ? data.speech_voices : []};
  companion?.enableVoice(voiceConfig);
  if (!data.ai) byId("ai").parentElement.title = "配置模型凭据后可启用，当前使用规则提示";
  loadExample(true);
}).catch(err => {
  voiceConfig = {record: false, voices: []};
  companion?.enableVoice(voiceConfig);
  notice(err.message);
});
</script>
