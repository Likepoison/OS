<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>循迹 OS · 操作系统实验工作台</title>
<link rel="icon" href="/pet/duck.png" type="image/png">
<style>
:root {
  color-scheme: light;
  --ink: oklch(.25 .029 265); --muted: oklch(.47 .038 265);
  --line: oklch(.90 .015 265); --paper: oklch(1 0 0); --canvas: oklch(.978 .008 265);
  --soft: oklch(.952 .016 266); --indigo: oklch(.46 .093 269);
  --teal: oklch(.43 .078 175); --teal-bg: oklch(.95 .028 173);
  --amber: oklch(.43 .084 66); --amber-bg: oklch(.96 .033 83);
  --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--canvas); font: 15px/1.55 system-ui, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button, select, a { -webkit-tap-highlight-color: transparent; }
button, select { cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--indigo); outline-offset: 3px;
}
a { color: var(--indigo); }
[hidden] { display: none !important; }
header { background: var(--paper); border-bottom: 1px solid var(--line); }
.bar, main { max-width: 1360px; margin: auto; padding-inline: 34px; }
.bar { min-height: 68px; display: flex; flex-wrap: wrap; align-items: center; column-gap: 44px; }
.brand { display: flex; align-items: center; gap: 11px; font-weight: 750; font-size: 20px; letter-spacing: -.025em; }
.mark { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--indigo); color: white; font: 600 14px var(--mono); }
nav { display: flex; gap: 22px; align-self: stretch; }
.tab { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 0 2px; min-height: 41px; color: var(--muted); white-space: nowrap; }
.tab[aria-pressed="true"] { border-bottom-color: var(--indigo); color: var(--indigo); font-weight: 680; }
.tab:hover { color: var(--indigo); }
.runtime { margin-left: auto; color: var(--muted); font: 12px var(--mono); letter-spacing: .01em; }
main { padding-block: 35px 56px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 34px; line-height: 1.2; letter-spacing: -.035em; }
h2 { font-size: 17px; letter-spacing: -.015em; }
h3 { font-size: 15px; }
.intro { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 16px; margin-bottom: 22px; }
.intro p { color: var(--muted); margin-top: 8px; }
.labbar { display: flex; gap: 17px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 13px 17px; background: var(--paper); margin-bottom: 18px; }
select, input[type="search"] { border: 1px solid var(--line); border-radius: 7px; background: var(--paper); padding: 7px 10px; }
#summary { color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); }
.panel-head, .panel-foot { padding: 14px 17px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 9px; }
.panel-head { border-bottom: 1px solid var(--line); }
.panel-foot { border-top: 1px solid var(--line); }
.tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.button { display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink); font-size: 13px; }
.button:hover:not(:disabled) { background: var(--soft); }
.primary { background: var(--indigo); color: white; border-color: var(--indigo); padding: 9px 16px; font-size: 14px; font-weight: 650; }
.primary:hover:not(:disabled) { background: oklch(.40 .093 269); }
.editor { display: flex; background: oklch(.99 .006 266); height: 470px; }
#numbers { color: var(--muted); background: var(--soft); margin: 0; padding: 13px 10px; overflow: hidden; text-align: right; min-width: 38px; border-right: 1px solid var(--line); user-select: none; }
#source, #numbers { font: 13px/23px var(--mono); tab-size: 4; }
#source { width: 100%; flex: 1; min-width: 0; background: transparent; padding: 13px 15px; border: 0; resize: none; white-space: pre; }
.status { padding: 3px 8px; font-size: 12px; font-weight: 650; border-radius: 6px; background: var(--soft); color: var(--indigo); }
.status.good { background: var(--teal-bg); color: var(--teal); }
.status.warn { background: var(--amber-bg); color: var(--amber); }
.result-nav { padding-inline: 17px; border-bottom: 1px solid var(--line); }
#contents { min-height: 392px; padding: 17px; }
.empty { display: grid; min-height: 340px; align-content: center; justify-items: center; text-align: center; gap: 9px; padding: 30px 15px; }
.empty p, .muted { color: var(--muted); font-size: 13px; }
.empty-mark { width: 46px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--soft); color: var(--indigo); font: 16px var(--mono); margin-bottom: 5px; }
.finding { padding: 13px 14px; border-radius: 9px; background: var(--soft); margin-bottom: 13px; }
.finding.warn { background: var(--amber-bg); }
.finding p { margin-top: 3px; font-size: 13px; }
.finding button { margin-top: 8px; }
.case { padding: 10px 1px; border-bottom: 1px solid var(--line); }
.case summary, .hint summary { cursor: pointer; font-weight: 630; }
.case pre, .event pre { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; font: 12px/1.55 var(--mono); margin: 6px 0; }
.case pre { background: var(--canvas); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 200px; overflow: auto; }
.case .muted { display: inline-block; margin-top: 6px; }
.trace-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.trace-tools input { min-width: 120px; flex: 1; }
.event-list { max-height: 405px; overflow: auto; }
.event { border-bottom: 1px solid var(--line); padding: 8px 7px; min-width: 0; }
.event.evidence { outline: 1px solid var(--line); outline-offset: -1px; background: var(--soft); }
.event small { color: var(--muted); font: 12px var(--mono); overflow-wrap: anywhere; }
.event pre { margin-bottom: 0; }
.pager { margin-top: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
.hint { padding: 13px 0; border-bottom: 1px solid var(--line); }
.hint p { padding: 8px 0 0; color: var(--muted); }
.notice { color: var(--amber); margin-top: 11px; overflow-wrap: anywhere; }
.ai-option { color: var(--muted); font-size: 13px; }
#counts { display: flex; flex-wrap: wrap; gap: 8px; padding: 13px 17px; border-bottom: 1px solid var(--line); }
#records { overflow-x: auto; }
#comparison { padding: 15px 17px; border-bottom: 1px solid var(--line); }
.comparison-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 9px; }
.comparison-entry { border: 1px solid var(--line); border-radius: 8px; padding: 11px; }
.comparison-entry p { margin: 5px 0; }
.comparison-entry button { margin: 6px 6px 0 0; }
.comparison-cases { padding-left: 20px; margin: 8px 0; font-size: 13px; }
.comparison-cases li + li { margin-top: 4px; }
@media (max-width: 540px) { .comparison-grid { grid-template-columns: 1fr; } }
table { border-collapse: collapse; width: 100%; text-align: left; }
th, td { white-space: nowrap; padding: 10px 17px; border-bottom: 1px solid var(--line); }
th { background: var(--canvas); color: var(--muted); font-weight: 620; }
td code { font: 12px var(--mono); }
.pet-launch { position: fixed; z-index: 3; right: 16px; bottom: 16px; width: 62px; height: 62px;
  display: grid; place-items: center; border: 1px solid var(--line); border-radius: 20px;
  background: var(--paper); box-shadow: 0 4px 18px oklch(.30 .05 266 / .14);
  cursor: grab; touch-action: none; user-select: none; }
.pet-launch:hover, .pet-launch[aria-expanded="true"] { background: var(--soft); border-color: var(--indigo); }
.pet-launch.dragging { cursor: grabbing; }
.pet-launch img { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
.pet-launch[data-mood="working"] { border-color: var(--indigo); }
.pet-launch[data-mood="success"] { border-color: var(--teal); background: var(--teal-bg); }
.pet-launch[data-mood="review"] { border-color: var(--amber); background: var(--amber-bg); }
.pet-panel { position: fixed; z-index: 2; width: min(344px, calc(100vw - 24px));
  max-height: calc(100dvh - 24px); overflow: auto; overscroll-behavior: contain;
  padding: 15px; border: 1px solid var(--line); border-radius: 17px;
  background: var(--paper); box-shadow: 0 10px 28px oklch(.30 .05 266 / .16); }
.pet-bubble { position: fixed; z-index: 2; width: min(258px, calc(100vw - 24px));
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
  box-shadow: 0 4px 18px oklch(.30 .05 266 / .10); font-size: 13px; pointer-events: none; }
.pet-head, .pet-form { display: flex; align-items: center; gap: 8px; }
.pet-head { justify-content: space-between; }
.pet-head h2 { margin: 0; }
.pet-reply { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
.pet-panel .tool-row { margin-bottom: 10px; }
.pet-form input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px; }
.pet-form button { flex: none; }
.pet-quiz { margin: 10px 0; padding: 0; border: 0; min-width: 0; }
.pet-quiz legend { font-weight: 650; font-size: 14px; margin-bottom: 6px; padding: 0; }
.pet-quiz button { display: flex; width: 100%; margin-bottom: 5px; text-align: left; }
.pet-quiz button:disabled { cursor: default; }
.pet-help { margin-top: 9px; }
.pet-controls { display: flex; flex-wrap: wrap; gap: 12px; }
@media (max-width: 850px) {
  .grid { grid-template-columns: 1fr; }
  .editor { height: 370px; }
  .bar, main { padding-inline: 20px; }
}
@media (max-width: 540px) {
  .bar { column-gap: 19px; }
  main { padding-top: 23px; }
  h1 { font-size: 28px; }
  .runtime { display: none; }
  .labbar { flex-wrap: wrap; gap: 5px; }
  .panel-head, .panel-foot, #contents { padding-inline: 13px; }
}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><span class="mark" aria-hidden="true">&gt;_</span>循迹 OS</div>
  <nav aria-label="页面">
    <button type="button" class="tab" id="work-tab" aria-pressed="true">实验工作台</button>
    <button type="button" class="tab" id="history-tab" aria-pressed="false">实验记录</button>
  </nav>
  <span class="runtime">Linux · C · strace</span>
  <button type="button" class="button" id="pet-restore" hidden>显示助教</button>
</div></header>
<main>
<section id="workspace" aria-labelledby="work-title">
  <div class="intro"><div><h1 id="work-title">操作系统实验工作台</h1><p>从测试判定追溯到系统调用，逐层查看排查提示。</p></div></div>
  <div class="labbar">
    <label for="lab"><strong>实验</strong></label><select id="lab"></select><p id="summary"></p>
  </div>
  <div class="grid">
    <section class="panel" aria-labelledby="code-title">
      <div class="panel-head"><h2 id="code-title">源代码 <span class="muted">· main.c</span></h2>
        <div class="tool-row"><button class="button" id="good" type="button">正确样例</button><button class="button" id="bad" type="button">故障样例</button></div>
      </div>
      <div class="editor"><pre id="numbers" aria-hidden="true">1</pre><textarea id="source" aria-label="C 源代码" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea></div>
      <div class="panel-foot"><label class="ai-option"><input type="checkbox" id="ai" disabled> 请求 AI 提示</label>
        <button class="button primary" id="run" type="button" disabled>运行实验 <span aria-hidden="true">→</span></button>
      </div>
    </section>
    <section class="panel" aria-labelledby="result-title">
      <div class="panel-head"><h2 id="result-title">运行分析</h2><span class="status" id="status" role="status">待提交</span></div>
      <nav aria-label="运行分析" class="result-nav">
        <button class="tab" data-tab="grade" type="button" aria-pressed="true">测试判定</button>
        <button class="tab" data-tab="trace" type="button" aria-pressed="false">系统调用</button>
        <button class="tab" data-tab="hints" type="button" aria-pressed="false">分层提示</button>
      </nav>
      <div id="contents"></div>
    </section>
  </div>
  <p class="notice" id="notice" role="alert" hidden></p>
</section>
<section id="history" hidden aria-labelledby="history-title">
  <div class="intro"><div><h1 id="history-title">实验记录</h1><p>按实验查看最近 50 条记录和累计判定统计。</p></div>
    <div class="tool-row">
      <label>筛选实验 <select id="filter"><option value="">全部实验</option></select></label>
      <button class="button" id="compare" type="button" disabled>对比最近两次</button>
    </div>
  </div>
  <div class="panel"><div id="counts"></div><section id="comparison" hidden aria-live="polite"></section><div id="records"></div></div>
</section>
</main>
<button id="pet-launch" class="pet-launch" type="button" aria-label="排错鸭助教" aria-controls="pet-panel"
  aria-expanded="false" title="排错鸭助教 · 点击打开，可拖动">
  <img src="/pet/duck.png" alt="" width="48" height="48" draggable="false">
</button>
<p id="pet-bubble" class="pet-bubble" role="status" hidden></p>
<aside id="pet-panel" class="pet-panel" aria-labelledby="pet-title" hidden>
  <div class="pet-head"><h2 id="pet-title" tabindex="-1">排错鸭助教</h2>
    <button id="pet-close" class="button" type="button">收起</button></div>
  <p id="pet-reply" class="pet-reply" role="status"></p>
  <div class="tool-row" id="pet-actions"></div>
  <fieldset class="pet-quiz" id="pet-quiz" hidden><legend id="pet-question"></legend><div id="pet-choices"></div></fieldset>
  <form class="pet-form" id="pet-form"><input id="pet-input" aria-label="问排错鸭" maxlength="100"
    placeholder="例如：为什么超时？" autocomplete="off" required><button class="button" type="submit">发送</button></form>
  <p class="muted pet-help">可拖动小鸭。键盘聚焦后用方向键移动，Esc 收起。</p>
  <div class="pet-controls"><button id="pet-hide" class="tab" type="button">隐藏桌宠</button>
    <button id="pet-reset" class="tab" type="button" hidden>回到角落</button></div>
</aside>
<script>
const byId = id => document.getElementById(id);
const source = byId("source"), select = byId("lab"), contents = byId("contents");
const labels = {
  queued:"排队中", running:"编译与运行中", analyzing:"分析证据中", finished:"评测完成",
  platform_error:"平台运行失败", interrupted:"服务已中断", passed:"通过", wrong_output:"输出不符",
  compile_error:"编译失败", compile_timeout:"编译超时", runtime_error:"异常退出", signal_exit:"信号终止",
  trace_error:"采集异常", timeout:"运行超时",
  oom:"内存超限", output_limit:"日志达到上限", missing_behavior:"缺少要求的调用",
  pipe_wait:"管道 EOF 等待", file_error:"文件操作错误", memory_limit:"内存超限", sync_wait:"同步等待"
};
let labs = [], record, tab = "grade", polling = false, caseIndex = 0, onlyEvidence = false, viewVersion = 0;
let historyVersion = 0, pair = [];
let companion;
const el = (tag, text, cls) => {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
};
function button(text, click) {
  const b = el("button", text, "button");
  b.type = "button";
  b.addEventListener("click", click);
  return b;
}
async function api(path, options) {
  const rs = await fetch(path, options);
  const data = await rs.json();
  if (!rs.ok) throw new Error(data.error || "请求失败");
  return data;
}
function notice(message = "") {
  byId("notice").textContent = message;
  byId("notice").hidden = !message;
}
function lines() {
  const gutter = byId("numbers");
  gutter.textContent = Array.from({length: source.value.split("\n").length}, (_, i) => i + 1).join("\n");
  gutter.scrollTop = source.scrollTop;
}
function loadExample(broken) {
  const lab = labs.find(item => item.id === select.value);
  if (!lab) return;
  source.value = broken ? lab.broken : lab.sample;
  source.scrollTop = 0;
  byId("summary").textContent = lab.summary;
  lines();
  if (!polling) byId("run").disabled = false;
}
function navigate(history) {
  byId("workspace").hidden = history;
  byId("history").hidden = !history;
  byId("work-tab").setAttribute("aria-pressed", String(!history));
  byId("history-tab").setAttribute("aria-pressed", String(history));
  if (history) refreshHistory();
}
function showTab(next, initialTracePage = 0) {
  tab = next;
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === next)));
  render(initialTracePage);
}
function showFindingTrace(result) {
  caseIndex = result.evidence_case;
  onlyEvidence = result.diagnosis.evidence.length > 0 && result.diagnosis.confidence !== "insufficient";
  showTab("trace", onlyEvidence ? 0 : "last");
}
function traceActionLabel(result) {
  if (!result.cases[result.evidence_case]?.trace_available) return "";
  if (result.diagnosis.evidence.length && result.diagnosis.confidence !== "insufficient") return "查看关联事件";
  return result.passed !== result.total ? "查看末尾轨迹" : "";
}
function petSnapshot(run) {
  if (!run) return null;
  const result = run.result;
  return {
    id: run.id,
    state: run.state,
    hasResult: Boolean(result),
    passed: Boolean(result && result.scored !== false && result.passed === result.total),
    code: result?.diagnosis.code,
    confidence: result?.diagnosis.confidence,
    ai: result?.feedback.source === "ai",
    traceLabel: result ? traceActionLabel(result) : ""
  };
}
function openPetResult(id, kind) {
  if (id !== record?.id || !record.result) return;
  navigate(false);
  if (kind === "trace") showFindingTrace(record.result);
  else if (kind === "hints") showTab("hints");
  document.querySelector('[data-tab="' + (kind === "trace" ? "trace" : "hints") + '"]').focus();
}
function render(initialTracePage = 0) {
  companion?.update(petSnapshot(record));
  const version = ++viewVersion;
  contents.replaceChildren();
  const result = record?.result;
  const badge = byId("status");
  badge.textContent = labels[record?.state] || "待提交";
  badge.className = "status";
  if (!result) {
    if (record?.state === "platform_error") badge.classList.add("warn");
    const box = el("div", undefined, "empty");
    box.append(el("span", "↳", "empty-mark"),
      el("h3", record ? (labels[record.state] || "运行中") : "等待一次实验运行"),
      el("p", record?.state === "platform_error" ? "请在演示终端检查 Docker 服务与镜像，再重新运行。"
      : record ? "任务在独立容器执行，结果会自动更新。" : "运行左侧代码，在这里查看用例、轨迹和提示。"));
    contents.append(box);
    return;
  }
  const scored = result.scored !== false;
  const ok = scored && result.passed === result.total;
  badge.textContent = scored ? result.passed + " / " + result.total + " 通过" : "采集异常 · 本次不计分";
  badge.classList.add(ok ? "good" : "warn");
  if (tab === "trace") {
    traceView(result, version, initialTracePage);
    return;
  }
  if (tab === "hints") {
    const fb = result.feedback;
    const src = fb.source === "ai" ? "AI · " + fb.model : "规则提示" + (fb.reason ? " · " + fb.reason : "");
    contents.append(el("p", src, "muted"));
    fb.hints.forEach((hint, i) => {
      const item = el("details", undefined, "hint");
      item.open = i === 0;
      item.append(el("summary", ["观察方向", "相关原理", "证据定位"][i]), el("p", hint));
      contents.append(item);
    });
    if (traceActionLabel(result)) contents.append(button(traceActionLabel(result), () => showFindingTrace(result)));
    return;
  }
  const diagnosis = result.diagnosis;
  const box = el("div", undefined, ok ? "finding" : "finding warn");
  box.append(el("h3", diagnosis.title));
  const confidence = {confirmed:"已确认", suspected:"疑似", insufficient:"证据不足"};
  const assessedLab = labs.find(l => l.id === record.lab);
  if (assessedLab && record.lab !== select.value) box.append(el("p", "本条记录 · " + assessedLab.title));
  if (!ok) box.append(el("p", confidence[diagnosis.confidence] + " · " +
    (diagnosis.evidence.length ? "关联 " + diagnosis.evidence.length + " 条轨迹事件" : "依据测试判定")));
  if (diagnosis.detail) box.append(el("p", diagnosis.detail));
  if (traceActionLabel(result)) box.append(button(traceActionLabel(result), () => showFindingTrace(result)));
  contents.append(box);
  result.cases.forEach((test, i) => {
    const details = el("details", undefined, "case");
    details.open = i === result.evidence_case && !ok;
    const elapsed = test.duration_ms === undefined ? "" : " · " + test.duration_ms + " ms";
    details.append(el("summary", test.name + " · " + (labels[test.status] || test.status) + elapsed));
    const code = test.compile;
    if (test.status === "compile_error" || test.status === "compile_timeout") {
      details.append(el("pre", code.stderr || "编译过程未正常结束"));
    }
    else {
      if (test.stdin !== undefined) details.append(el("p", "用例输入", "muted"), el("pre", test.stdin || "（空输入）"));
      const expectedLabel = ["mutex", "deadlock"].includes(record.lab) ? "预期输出（工作线程行顺序不限）" : "预期输出";
      details.append(el("p", expectedLabel, "muted"), el("pre", test.expected || "（空输出）"));
      details.append(el("p", "实际输出", "muted"), el("pre", test.stdout || "（空输出）"));
      if (test.stderr) details.append(el("pre", test.stderr));
    }
    contents.append(details);
  });
}
function traceView(result, version, initialPage) {
  const tools = el("div", undefined, "trace-tools"), picker = el("select");
  picker.setAttribute("aria-label", "轨迹用例");
  result.cases.forEach((test, i) => {
    const o = el("option", test.name);
    o.value = i; picker.append(o);
  });
  picker.value = caseIndex;
  const search = el("input"), events = el("div", undefined, "event-list"), pager = el("div", undefined, "pager");
  search.type = "search"; search.placeholder = "查调用、PID 或 errno"; search.setAttribute("aria-label", "搜索轨迹");
  const base = "/api/runs/" + record.id;
  const raw = el("a", "原始日志"); raw.target = "_blank"; raw.rel = "noopener";
  const filter = button(onlyEvidence ? "显示全部" : "只看证据", () => {
    onlyEvidence = !onlyEvidence; showTab("trace");
  });
  filter.disabled = !(caseIndex === result.evidence_case && result.diagnosis.evidence.length);
  raw.href = base + "/raw/" + caseIndex;
  raw.hidden = !result.cases[caseIndex]?.trace_available;
  picker.addEventListener("change", () => { caseIndex = Number(picker.value); onlyEvidence = false; showTab("trace"); });
  tools.append(picker, search, filter, raw);
  contents.append(tools);
  if (result.cases[caseIndex]?.trace_truncated) contents.append(el("p", "轨迹提前结束，未返回的调用保留为等待事件。", "muted"));
  contents.append(events, pager);
  let requests = 0, timer;
  async function load(page) {
    const seq = ++requests;
    const path = base + "/events/" + caseIndex + "?" + new URLSearchParams({
      page, q: search.value, only: onlyEvidence && !search.value ? "evidence" : "all"
    });
    try {
      const data = await api(path);
      if (seq !== requests || version !== viewVersion) return;
      events.replaceChildren();
      pager.replaceChildren();
      if (!data.events.length) events.append(el("p", "没有匹配的轨迹事件。", "muted"));
      for (const ev of data.events) {
        const linked = caseIndex === result.evidence_case && result.diagnosis.evidence.includes(ev.id);
        const row = el("article", undefined, linked ? "event evidence" : "event");
        const sourceLines = ev.lines.join("、");
        row.append(el("small", "#" + ev.id + " · PID/TID " + ev.pid + " · 原日志行 " + sourceLines +
          (ev.duration_us != null ? " · " + ev.duration_us + " µs" : "")), el("pre", ev.text));
        events.append(row);
      }
      const previous = button("上一页", () => load(data.page - 1));
      const next = button("下一页", () => load(data.page + 1));
      previous.disabled = data.page === 0; next.disabled = (data.page + 1) * 40 >= data.total;
      if (data.total) pager.append(previous, el("span", "共 " + data.total + " 条", "muted"), next);
    } catch (err) {
      if (seq === requests && version === viewVersion) events.replaceChildren(el("p", err.message, "notice"));
    }
  }
  search.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => load(0), 180); });
  load(initialPage);
}
async function track(id) {
  polling = true;
  byId("run").disabled = true;
  try {
    for (let attempt = 0; attempt < 160; attempt++) {
      record = await api("/api/runs/" + id);
      if (record.result || record.state === "platform_error") {
        caseIndex = record.result?.evidence_case || 0;
        showTab("grade");
        return;
      }
      render();
      await new Promise(resolve => setTimeout(resolve, 500));
    }
    notice("任务尚未返回，请通过实验记录继续查看。");
  } catch (err) { notice(err.message); }
  finally {
    polling = false;
    byId("run").disabled = false;
  }
}
async function openRecord(id, openTrace = false) {
  if (polling) {
    navigate(false);
    notice("当前实验运行结束后可打开历史记录。");
    return;
  }
  navigate(false);
  notice();
  onlyEvidence = false;
  await track(id);
  if (openTrace && record?.id === id && record.result) showFindingTrace(record.result);
}

async function compareRuns() {
  const version = historyVersion, panel = byId("comparison"), control = byId("compare");
  if (pair.length !== 2) return;
  control.disabled = true;
  panel.hidden = false;
  panel.replaceChildren(el("p", "正在读取两次实验记录…", "muted"));
  try {
    const runs = await Promise.all(pair.map(run => api("/api/runs/" + run.id)));
    if (historyVersion !== version) return;
    const after = runs[1];
    const name = labs.find(lab => lab.id === after.lab).title;
    const grid = el("div", undefined, "comparison-grid");
    runs.forEach((run, i) => {
      const {result} = run;
      const box = el("article", undefined, "comparison-entry");
      const evidence = result.diagnosis.evidence.length;
      const cases = el("ul", undefined, "comparison-cases");
      result.cases.forEach(test => cases.append(el("li", test.name + " · " + (labels[test.status] || test.status))));
      if (result.cases.length < result.total) cases.append(el("li", "其余用例未运行"));
      box.append(el("h3", i === 0 ? "较早一次" : "最近一次"),
        el("p", result.passed + " / " + result.total + " 用例通过 · " + result.diagnosis.title),
        cases,
        el("p", evidence ? evidence + " 条关联证据" : "无关联轨迹证据", "muted"),
        button("打开记录", () => openRecord(run.id)));
      if (traceActionLabel(result)) box.append(button(traceActionLabel(result), () => openRecord(run.id, true)));
      grid.append(box);
    });
    panel.replaceChildren(el("h2", name + " · 前后对比"), grid);
  } catch (err) {
    if (historyVersion === version) panel.replaceChildren(el("p", err.message, "notice"));
  } finally {
    if (historyVersion === version) control.disabled = false;
  }
}

async function refreshHistory() {
  const version = ++historyVersion;
  const selected = byId("filter").value;
  byId("comparison").hidden = true;
  byId("compare").disabled = true;
  pair = [];
  try {
    const data = await api("/api/runs?" + new URLSearchParams({lab:selected}));
    if (historyVersion !== version) return;
    const finished = data.runs.filter(run => run.state === "finished");
    const counts = new Map();
    for (const run of finished) counts.set(run.lab, (counts.get(run.lab) || 0) + 1);
    const comparable = finished.find(run => counts.get(run.lab) > 1);
    pair = finished.filter(run => run.lab === comparable?.lab).slice(0, 2).reverse();
    byId("compare").disabled = pair.length !== 2;
    byId("counts").replaceChildren(...data.counts.map(c => el("span", (labels[c.outcome] || c.outcome) + " · " + c.count, "status")));
    const table = el("table"), thead = el("thead"), head = el("tr"), body = el("tbody");
    ["实验", "时间", "判定", "记录编号", "操作"].forEach(t => head.append(el("th", t)));
    thead.append(head); table.append(thead, body);
    data.runs.forEach(run => {
      const row = el("tr"), slug = el("td"), action = el("td");
      slug.append(el("code", run.id.slice(0, 8)));
      action.append(button("查看", () => openRecord(run.id)));
      row.append(el("td", labs.find(l => l.id === run.lab)?.title ?? run.lab), el("td", new Date(run.created).toLocaleString()),
        el("td", labels[run.outcome] || labels[run.state] || run.state), slug, action);
      body.append(row);
    });
    byId("records").replaceChildren(data.runs.length ? table : el("div", "运行实验后，判定和轨迹会出现在这里。", "empty"));
  } catch (err) {
    if (historyVersion === version) byId("records").replaceChildren(el("p", err.message, "empty"));
  }
}
byId("work-tab").addEventListener("click", () => navigate(false));
byId("history-tab").addEventListener("click", () => navigate(true));
byId("filter").addEventListener("change", refreshHistory);
byId("compare").addEventListener("click", compareRuns);
byId("good").addEventListener("click", () => loadExample(false));
byId("bad").addEventListener("click", () => loadExample(true));
select.addEventListener("change", () => loadExample(false));
source.addEventListener("input", lines);
source.addEventListener("scroll", () => { byId("numbers").scrollTop = source.scrollTop; });
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
byId("run").addEventListener("click", async () => {
  if (polling) return;
  polling = true;
  companion?.update({state:"queued"});
  notice(); byId("run").disabled = true;
  try {
    const queued = await api("/api/runs", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({lab:select.value, source:source.value, ai:byId("ai").checked})});
    onlyEvidence = false;
    await track(queued.id);
  } catch (err) {
    notice(err.message); polling = false; byId("run").disabled = false;
    companion?.update(petSnapshot(record));
  }
});
render();
api("/api/labs").then(data => {
  labs = data.labs;
  for (const lab of labs) {
    const option = el("option", lab.title);
    option.value = lab.id;
    select.append(option);
    byId("filter").append(option.cloneNode(true));
  }
  byId("ai").disabled = !data.ai;
  if (!data.ai) byId("ai").parentElement.title = "配置模型凭据后可启用，当前使用规则提示";
  loadExample(true);
}).catch(err => notice(err.message));
</script>
<script src="/pet/companion.js" defer></script>
