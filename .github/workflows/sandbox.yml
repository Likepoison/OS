name: Sandbox acceptance

on:
  push:
  workflow_dispatch:
    inputs:
      verify_live_ai:
        description: "Verify one real DeepSeek response"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash tests/sandbox.sh
      - run: python3 -m unittest discover -s tests -p test_system.py -v
      - name: Verify browser demo
        timeout-minutes: 3
        env:
          TRACE_LIVE_AI: ${{ inputs.verify_live_ai == true && '1' || '0' }}
          DEEPSEEK_API_KEY: ${{ inputs.verify_live_ai == true && secrets.DEEPSEEK_API_KEY || '' }}
        run: |
          mkdir -p ~/.local/share/fonts
          curl --fail --silent --show-error --max-time 30 --retry 1 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            -o ~/.local/share/fonts/NotoSansCJKsc-Regular.otf
          fc-cache -f ~/.local/share/fonts
          python3 -m venv "$RUNNER_TEMP/trace-browser"
          source "$RUNNER_TEMP/trace-browser/bin/activate"
          pip install playwright
          python -m playwright install chromium
          TRACE_SCREENSHOTS="$RUNNER_TEMP/trace-screenshots" python -m unittest discover -s tests -p test_web.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screenshots
          path: ${{ runner.temp }}/trace-screenshots
          if-no-files-found: ignore
          retention-days: 7

  devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: >-
            docker info --format 'cgroup={{.CgroupVersion}} driver={{.CgroupDriver}}'
            && docker image inspect tracetutor-sandbox --format '{{.Id}}'
            && python3 -c "from engine import evaluate; from labs import LABS, sample; result = evaluate('pipe', sample(LABS['pipe']), 'devcontainer-smoke'); assert result['passed'] == 2, result['diagnosis']"
