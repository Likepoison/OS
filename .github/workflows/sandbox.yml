name: Sandbox acceptance

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash tests/sandbox.sh
      - run: python3 -m unittest discover -s tests -v
